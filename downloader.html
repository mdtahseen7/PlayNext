<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Download · PlayNext</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #0a0a0a;
      --card-2: #0f0f0f;
      --border: #1e1e1e;
      --border-hi: #2e2e2e;
      --text: #ededed;
      --text-2: #a1a1a1;
      --text-3: #737373;
      --blue: #0070f3;
      --blue-lt: #3291ff;
      --red: #e5484d;
      --green: #3fb950;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 40px 20px 56px;
    }

    .app {
      width: 100%;
      max-width: 620px;
    }

    /* ---------- top bar ---------- */
    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px var(--border);
    }

    .mark img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .ver {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-3);
      font-family: 'Geist Mono', ui-monospace, monospace;
    }

    /* ---------- card ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      margin-top: 24px;
    }

    /* ---------- title + poster ---------- */
    .head {
      display: flex;
      gap: 22px;
      align-items: flex-start;
    }

    .poster {
      display: none;
      width: 104px;
      height: 156px;
      flex-shrink: 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card-2);
    }

    .poster.on {
      display: block;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .head-text {
      flex: 1;
      min-width: 0;
      padding-top: 2px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.6px;
      line-height: 1.25;
      word-break: break-word;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 12.5px;
      color: var(--text-3);
    }

    .meta .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--border-hi);
    }

    .mono {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 12px;
    }

    /* ---------- quality ---------- */
    .field {
      margin-top: 24px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%),
        linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
      background-position: calc(100% - 19px) 50%, calc(100% - 14px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    select:hover {
      border-color: var(--border-hi);
    }

    select:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
    }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-3);
    }

    /* ---------- buttons ---------- */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    .btn.primary {
      background: var(--blue);
      color: #fff;
    }

    .btn.primary:hover:not(:disabled) {
      background: #0060d1;
    }

    .btn.primary:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .btn.ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text-2);
    }

    .btn.ghost:hover:not(:disabled) {
      border-color: var(--border-hi);
      color: var(--text);
    }

    .btn.danger {
      color: var(--red);
      border-color: rgba(229, 72, 77, 0.35);
    }

    .btn.danger:hover:not(:disabled) {
      background: rgba(229, 72, 77, 0.1);
      border-color: rgba(229, 72, 77, 0.6);
    }

    .hidden {
      display: none !important;
    }

    /* ---------- progress ---------- */
    .progress {
      margin-top: 26px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .pct {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }

    .pct .unit {
      font-size: 17px;
      font-weight: 500;
      color: var(--text-3);
      margin-left: 2px;
    }

    .bar {
      height: 8px;
      background: #171717;
      border-radius: 99px;
      margin-top: 14px;
      overflow: hidden;
    }

    .bar > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, var(--blue), var(--blue-lt));
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin-top: 12px;
      font-size: 12.5px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .stats b {
      color: var(--text-2);
      font-weight: 600;
    }

    /* ---------- status ---------- */
    .status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 22px;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-2);
      min-height: 20px;
    }

    .status .bullet {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-3);
      margin-top: 6px;
      flex-shrink: 0;
    }

    .status.ok .bullet {
      background: var(--green);
    }

    .status.err .bullet {
      background: var(--red);
    }

    .status.busy .bullet {
      background: var(--blue);
      animation: pulse 1.1s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }
    }

    .status .file {
      color: var(--text);
      font-weight: 600;
    }

    /* ---------- footer ---------- */
    .foot {
      margin-top: 20px;
      font-size: 11.5px;
      color: #4d4d4d;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="top">
      <div class="mark"><img src="icons/logo.png" alt=""></div>
      <div>
        <div class="brand">PlayNext</div>
        <div class="brand-sub">Downloader</div>
      </div>
      <div class="ver" id="ver"></div>
    </div>

    <div class="card">
      <div class="head">
        <div class="poster" id="posterWrap">
          <img id="poster" alt="">
        </div>
        <div class="head-text">
          <h1 id="ttl">Preparing</h1>
          <div class="meta">
            <span id="srcLine">Source</span>
          </div>
        </div>
      </div>

      <div id="qualityWrap" class="field hidden">
        <label for="quality">Quality</label>
        <select id="quality"></select>
        <div class="hint" id="qualityHint"></div>
      </div>

      <div class="actions">
        <button id="startBtn" class="btn primary">Download</button>
        <button id="cancelBtn" class="btn ghost danger hidden">Cancel</button>
        <button id="againBtn" class="btn ghost hidden">Download again</button>
        <button id="openBtn" class="btn ghost hidden">Show file</button>
      </div>

      <div id="progressWrap" class="progress hidden">
        <div class="pct"><span id="pct">0</span><span class="unit">%</span></div>
        <div class="bar"><div id="fill"></div></div>
        <div class="stats">
          <span id="detail"></span>
          <span id="speed"></span>
          <span id="eta"></span>
        </div>
      </div>

      <div id="status" class="status"><span class="bullet"></span><span id="statusText"></span></div>
    </div>

    <div class="foot">Runs entirely in your browser. Nothing is uploaded anywhere.</div>
  </div>

  <script src="mp4-muxer.js"></script>
  <script src="downloader.js"></script>
</body>

</html>
