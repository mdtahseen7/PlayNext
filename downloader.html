<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Download · PlayNext</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      background: #000000;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 22px 40px;
    }
    .brand { color: #ededed; font-weight: 800; font-size: 13px; letter-spacing: 0.4px; }
    h1 { font-size: 20px; margin: 6px 0 4px; }
    .sub { color: #999; font-size: 13px; margin: 0 0 20px; word-break: break-all; }
    label { display: block; font-size: 12px; color: #aaa; margin: 14px 0 6px; }
    select {
      width: 100%;
      background: #0a0a0a;
      color: #eee;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
    }
    .btns { display: flex; gap: 10px; margin-top: 20px; }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    #startBtn { background: #0070f3; color: #fff; }
    #startBtn:disabled { opacity: 0.5; cursor: default; }
    #cancelBtn { background: rgba(255, 255, 255, 0.08); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.35); display: none; }
    #status { font-size: 13.5px; color: #ccc; margin-top: 20px; min-height: 18px; }
    #bar { height: 8px; background: #22222a; border-radius: 99px; margin-top: 10px; overflow: hidden; }
    #fill { height: 100%; width: 0%; background: linear-gradient(to right, #0070f3, #3291ff); border-radius: 99px; transition: width 0.25s ease; }
    #detail { font-size: 12px; color: #888; margin-top: 8px; min-height: 15px; font-variant-numeric: tabular-nums; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="brand">▲ PlayNext Downloader</div>
    <h1 id="ttl">Preparing…</h1>
    <p class="sub" id="srcLine"></p>

    <div id="qualityWrap" style="display:none">
      <label for="quality">Quality</label>
      <select id="quality"></select>
    </div>

    <div class="btns">
      <button id="startBtn">Start Download</button>
      <button id="cancelBtn">Cancel</button>
    </div>

    <div id="status">Waiting — press Start.</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="detail"></div>
  </div>

  <script src="downloader.js"></script>
</body>

</html>
